name: Update Gradle wrapper

# Run by hand: Actions tab -> "Update Gradle wrapper" -> Run workflow.
# It regenerates gradle-wrapper.jar, gradlew and gradlew.bat from the official Gradle release,
# checks the jar against the checksum Gradle publishes (https://gradle.org/release-checksums/)
# and commits the result to the branch it was run on. If the checksum does not match, nothing is committed.

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_VERSION: "8.9"
  GRADLE_DIST_SHA256: d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab
  WRAPPER_JAR_SHA256: 498495120a03b9a6ab5d155f5de3c8f0d986a449153702fb80fc80e134484f17

jobs:
  update-wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate the wrapper in an empty folder
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/wrapper"
          mkdir -p "$tmp"
          cd "$tmp"
          touch settings.gradle
          gradle wrapper --gradle-version "$GRADLE_VERSION" --gradle-distribution-sha256-sum "$GRADLE_DIST_SHA256"
          echo "$WRAPPER_JAR_SHA256  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
          grep -q "^distributionSha256Sum=$GRADLE_DIST_SHA256$" gradle/wrapper/gradle-wrapper.properties
          grep -q "gradle-$GRADLE_VERSION-bin.zip" gradle/wrapper/gradle-wrapper.properties
          cd "$GITHUB_WORKSPACE"
          cp "$tmp/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/gradle-wrapper.jar
          cp "$tmp/gradle/wrapper/gradle-wrapper.properties" gradle/wrapper/gradle-wrapper.properties
          cp "$tmp/gradlew" gradlew
          cp "$tmp/gradlew.bat" gradlew.bat
          chmod +x gradlew

      - name: Commit the result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties gradlew gradlew.bat
          if git diff --cached --quiet; then
            echo "Nothing to change: the wrapper is already Gradle $GRADLE_VERSION."
          else
            git commit -m "Update Gradle wrapper to $GRADLE_VERSION"
            git push
          fi
